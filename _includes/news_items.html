{% assign limit = include.limit | default: 9999 %}
{% assign news_items = site.data.news.items %}
{% for item in news_items limit: limit %}
<div class="news-item">
<strong>{{ item.date }}</strong>{% if item.link %} <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer">{{ item.text }}</a>{% else %} {{ item.text }}{% endif %}
</div>
{% endfor %}
